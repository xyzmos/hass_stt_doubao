name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: "ubuntu-latest"
    steps:
      - name: Checkout
        uses: "actions/checkout@v4"

      - name: Check tag matches manifest version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          # 兼容无 v 前缀的 tag，例如 1.2.0
          MANIFEST_VERSION=$(python3 -c "import json; print(json.load(open('custom_components/hass_stt_doubao/manifest.json'))['version'])")
          if [ "$TAG" != "$MANIFEST_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match manifest version $MANIFEST_VERSION"
            exit 1
          fi
          echo "Tag $GITHUB_REF_NAME matches manifest version $MANIFEST_VERSION"

      - name: Release
        uses: "softprops/action-gh-release@v2"
        with:
          generate_release_notes: true
          body: |
            ## 豆包语音识别 Home Assistant 集成

            ### 安装方式
            1. 在 HACS 中添加自定义仓库 `https://github.com/xyzmos/hass_stt_doubao`
            2. 类别选择 **Integration**
            3. 搜索 **豆包语音识别** 并下载
            4. 重启 Home Assistant

            ### 更新内容
            详见 [README.md](https://github.com/xyzmos/hass_stt_doubao/blob/main/README.md)
